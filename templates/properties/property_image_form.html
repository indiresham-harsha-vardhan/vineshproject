<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Property Image | V3 LAND VENTURES</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        body {
            margin: 0;
            background: #f8f6f2;
            font-family: Arial, sans-serif;
        }

        .page-wrapper {
            min-height: 100vh;
            padding: 50px 15px;
        }

        .back-link {
            color: #6f442b;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link:hover {
            color: #4f2f1f;
        }

        .image-card {
            background: #ffffff;
            border: 1px solid #e8e1d9;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(60, 40, 20, .08);
        }

        .image-card-body {
            padding: 40px;
        }

        .page-title {
            color: #2d211b;
            font-weight: 700;
        }

        .property-name {
            color: #777;
        }

        .form-label {
            color: #3d2b22;
        }

        .form-control {
            min-height: 48px;
            border-radius: 10px;
            border: 1px solid #ddd2c8;
        }

        .form-control:focus {
            border-color: #8b5e3c;
            box-shadow: 0 0 0 0.2rem rgba(139, 94, 60, .12);
        }

        .form-check-input {
            width: 18px;
            height: 18px;
        }

        .form-check-input:checked {
            background-color: #6f442b;
            border-color: #6f442b;
        }

        .upload-btn {
            background: #6f442b;
            color: white;
            border: none;
            border-radius: 10px;
            min-height: 50px;
            font-weight: 600;
        }

        .upload-btn:hover {
            background: #4f2f1f;
            color: white;
        }

        .upload-icon {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: #f0e7df;
            color: #6f442b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            margin-bottom: 20px;
        }

        @media (max-width: 767px) {

            .page-wrapper {
                padding: 30px 15px;
            }

            .image-card-body {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


<div class="page-wrapper">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-12 col-md-8 col-lg-6">


                <!-- BACK -->

                <div class="mb-4">

                    <a
                        href="{% url 'properties:property_edit' property_obj.pk %}"
                        class="back-link"
                    >

                        <i class="fa-solid fa-arrow-left me-2"></i>

                        Back to Property

                    </a>

                </div>


                <!-- CARD -->

                <div class="image-card">

                    <div class="image-card-body">


                        <!-- ICON -->

                        <div class="upload-icon">

                            <i class="fa-solid fa-cloud-arrow-up"></i>

                        </div>


                        <!-- TITLE -->

                        <h2 class="page-title mb-2">

                            Add Property Image

                        </h2>


                        <p class="property-name mb-4">

                            {{ property_obj.title }}

                        </p>


                        <!-- FORM -->

                        <form
                            method="POST"
                            enctype="multipart/form-data"
                        >

                            {% csrf_token %}


                            {% for field in form %}

                                <div class="mb-4">

                                    <label
                                        class="form-label fw-semibold"
                                    >

                                        {{ field.label }}

                                    </label>


                                    {{ field }}


                                    {% if field.help_text %}

                                        <div class="form-text">

                                            {{ field.help_text }}

                                        </div>

                                    {% endif %}


                                    {% if field.errors %}

                                        <div class="text-danger small mt-2">

                                            {{ field.errors }}

                                        </div>

                                    {% endif %}

                                </div>

                            {% endfor %}


                            <!-- BUTTON -->

                            <button
                                type="submit"
                                class="btn upload-btn w-100"
                            >

                                <i class="fa-solid fa-cloud-arrow-up me-2"></i>

                                Upload Image

                            </button>

                        </form>


                    </div>

                </div>


            </div>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
