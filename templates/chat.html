{% extends "base.html" %}

{% block title %}
Chat With Us
{% endblock %}


{% block content %}

<div class="chat-page">

    <div class="chat-container">

        <div class="chat-header">

            <div>

                <span class="chat-online">
                    ● Online
                </span>

                <h2>
                    Chat With Us
                </h2>

                <p>
                    Our property experts are here to help.
                </p>

            </div>

        </div>


        <!-- START CHAT -->

        <div
            id="startChat"
            class="start-chat"
        >

            <div class="chat-icon">

                <i class="fa-solid fa-comments"></i>

            </div>

            <h3>
                Welcome!
            </h3>

            <p>
                Please enter your details
                to start a conversation.
            </p>


            <form id="startChatForm">

                {% csrf_token %}

                <input
                    type="text"
                    id="chatName"
                    placeholder="Your Name"
                    required
                >


                <input
                    type="tel"
                    id="chatPhone"
                    placeholder="Mobile Number"
                    required
                >


                <input
                    type="email"
                    id="chatEmail"
                    placeholder="Email (Optional)"
                >


                <button type="submit">

                    Start Chat

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>

        </div>


        <!-- CHAT BOX -->

        <div
            id="chatBox"
            class="chat-box"
            style="display:none;"
        >

            <div
                id="messages"
                class="messages"
            >
            </div>


            <form
                id="messageForm"
                class="message-form"
            >

                {% csrf_token %}

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Type your message..."
                    autocomplete="off"
                    required
                >

                <button type="submit">

                    <i class="fa-solid fa-paper-plane"></i>

                </button>

            </form>

        </div>

    </div>

</div>

<script>

let conversationId = null;

let lastMessageCount = 0;


const startChatForm =
    document.getElementById(
        "startChatForm"
    );


const messageForm =
    document.getElementById(
        "messageForm"
    );


const messagesContainer =
    document.getElementById(
        "messages"
    );


function getCookie(name) {

    let cookieValue = null;

    if (document.cookie &&
        document.cookie !== "") {

        const cookies =
            document.cookie.split(";");

        for (
            let cookie of cookies
        ) {

            cookie = cookie.trim();

            if (
                cookie.substring(
                    0,
                    name.length + 1
                ) ===
                (name + "=")
            ) {

                cookieValue =
                    decodeURIComponent(
                        cookie.substring(
                            name.length + 1
                        )
                    );

                break;
            }
        }
    }

    return cookieValue;
}


const csrftoken =
    getCookie("csrftoken");


startChatForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const formData =
            new FormData();


        formData.append(
            "name",
            document.getElementById(
                "chatName"
            ).value
        );


        formData.append(
            "phone",
            document.getElementById(
                "chatPhone"
            ).value
        );


        formData.append(
            "email",
            document.getElementById(
                "chatEmail"
            ).value
        );


        fetch(
            "{% url 'start_chat' %}",
            {

                method: "POST",

                headers: {
                    "X-CSRFToken":
                        csrftoken
                },

                body: formData

            }
        )
        .then(
            response => response.json()
        )
        .then(
            data => {

                if (data.success) {

                    conversationId =
                        data.conversation_id;


                    document.getElementById(
                        "startChat"
                    ).style.display =
                        "none";


                    document.getElementById(
                        "chatBox"
                    ).style.display =
                        "flex";


                    loadMessages();

                }

            }
        );

    }
);


messageForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const input =
            document.getElementById(
                "messageInput"
            );


        const message =
            input.value.trim();


        if (!message) {
            return;
        }


        const formData =
            new FormData();


        formData.append(
            "conversation_id",
            conversationId
        );


        formData.append(
            "message",
            message
        );


        fetch(
            "{% url 'send_message' %}",
            {

                method: "POST",

                headers: {
                    "X-CSRFToken":
                        csrftoken
                },

                body: formData

            }
        )
        .then(
            response => response.json()
        )
        .then(
            data => {

                if (data.success) {

                    input.value = "";

                    loadMessages();

                }

            }
        );

    }
);


function loadMessages() {

    if (!conversationId) {
        return;
    }


    fetch(
        "{% url 'get_messages' %}" +
        "?conversation_id=" +
        conversationId
    )
    .then(
        response => response.json()
    )
    .then(
        data => {

            if (!data.success) {
                return;
            }


            messagesContainer.innerHTML =
                "";


            data.messages.forEach(
                item => {

                    const message =
                        document.createElement(
                            "div"
                        );


                    message.className =
                        "chat-message " +
                        item.sender;


                    message.innerHTML = `

                        <div class="message-content">

                            ${escapeHtml(
                                item.message
                            )}

                        </div>

                        <span class="message-time">

                            ${item.created_at}

                        </span>

                    `;


                    messagesContainer.appendChild(
                        message
                    );

                }
            );


            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;


            lastMessageCount =
                data.messages.length;

        }
    );

}


function escapeHtml(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;
}


/*
   Check for admin replies
   every 3 seconds
*/

setInterval(
    function() {

        if (conversationId) {

            loadMessages();

        }

    },
    3000
);

</script>
<style>

.chat-page {

    min-height: 75vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 60px 20px;

    background: #faf8f5;

}


.chat-container {

    width: 100%;

    max-width: 650px;

    background: white;

    border-radius: 18px;

    overflow: hidden;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,0.08);

}


/* HEADER */

.chat-header {

    background: #332820;

    color: white;

    padding: 25px;

}


.chat-online {

    color: #8bd17c;

    font-size: 12px;

}


.chat-header h2 {

    margin: 8px 0 4px;

}


.chat-header p {

    margin: 0;

    color: #d5ccc5;

    font-size: 14px;

}


/* START */

.start-chat {

    padding: 45px 35px;

    text-align: center;

}


.chat-icon {

    width: 70px;

    height: 70px;

    margin: 0 auto 20px;

    display: flex;

    align-items: center;

    justify-content: center;

    background: #f1e5d9;

    color: #8b5e3c;

    border-radius: 50%;

    font-size: 28px;

}


.start-chat h3 {

    font-family: "Playfair Display", serif;

    font-size: 28px;

}


.start-chat p {

    color: #777;

    margin-bottom: 25px;

}


/* FORM */

#startChatForm {

    display: flex;

    flex-direction: column;

    gap: 13px;

}


#startChatForm input {

    width: 100%;

    border: 1px solid #ddd;

    padding: 13px 15px;

    border-radius: 7px;

    outline: none;

}


#startChatForm input:focus {

    border-color: #8b5e3c;

}


#startChatForm button {

    border: none;

    padding: 14px;

    background: #8b5e3c;

    color: white;

    border-radius: 7px;

    font-weight: 600;

    cursor: pointer;

}


/* CHAT BOX */

.chat-box {

    height: 550px;

    display: flex;

    flex-direction: column;

}


.messages {

    flex: 1;

    overflow-y: auto;

    padding: 20px;

    background: #faf8f5;

}


.chat-message {

    display: flex;

    flex-direction: column;

    margin-bottom: 15px;

}


.chat-message.visitor {

    align-items: flex-end;

}


.chat-message.admin {

    align-items: flex-start;

}


.message-content {

    max-width: 75%;

    padding: 11px 15px;

    border-radius: 12px;

    line-height: 1.5;

}


.chat-message.visitor
.message-content {

    background: #8b5e3c;

    color: white;

    border-bottom-right-radius: 3px;

}


.chat-message.admin
.message-content {

    background: white;

    color: #444;

    border: 1px solid #eee;

    border-bottom-left-radius: 3px;

}


.message-time {

    color: #999;

    font-size: 10px;

    margin-top: 4px;

}


/* MESSAGE FORM */

.message-form {

    display: flex;

    gap: 10px;

    padding: 15px;

    border-top: 1px solid #eee;

    background: white;

}


.message-form input {

    flex: 1;

    border: 1px solid #ddd;

    border-radius: 25px;

    padding: 12px 18px;

    outline: none;

}


.message-form button {

    width: 45px;

    height: 45px;

    border: none;

    border-radius: 50%;

    background: #8b5e3c;

    color: white;

    cursor: pointer;

}


@media(max-width:600px) {

    .chat-page {

        padding: 20px 10px;

    }


    .start-chat {

        padding: 35px 20px;

    }


    .chat-box {

        height: 500px;

    }

}

</style>
{% endblock %}
