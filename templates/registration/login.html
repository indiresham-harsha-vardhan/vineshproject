<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | V3 LAND VENTURES</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f1eb;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.12);
        }

        .login-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #5a3028;
            color: white;
            font-size: 26px;
        }

        .login-title {
            color: #3d211b;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-subtitle {
            color: #777;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-control {
            min-height: 48px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: #8b5e4a;
            box-shadow: 0 0 0 0.2rem rgba(139, 94, 74, 0.15);
        }

        .login-btn {
            width: 100%;
            min-height: 50px;
            border: none;
            border-radius: 10px;
            background: #5a3028;
            color: white;
            font-weight: 600;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #3d211b;
        }

        .alert {
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="login-icon">
        <i class="fa-solid fa-user-shield"></i>
    </div>

    <h2 class="login-title">
        Admin Login
    </h2>

    <p class="login-subtitle">
        Login to manage your properties
    </p>

    {% if form.errors %}
        <div class="alert alert-danger">
            <i class="fa-solid fa-circle-exclamation"></i>
            Invalid username or password.
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">
                Username
            </label>

            <input
                type="text"
                name="username"
                class="form-control"
                placeholder="Enter username"
                required
                autofocus
            >
        </div>

        <div class="mb-4">
            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter password"
                required
            >
        </div>

        <input
            type="hidden"
            name="next"
            value="{{ next }}"
        >

        <button type="submit" class="login-btn">
            <i class="fa-solid fa-right-to-bracket me-2"></i>
            Login
        </button>

    </form>

</div>

</body>
</html>
